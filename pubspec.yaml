name: inspection_app
description: "Inspection Record Form App with EXIF metadata parsing and PDF export."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  exif: ^3.3.0
  geolocator: ^13.0.2
  image_picker: ^1.1.2
  intl: ^0.19.0
  pdf: ^3.11.1
  printing: ^5.13.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
